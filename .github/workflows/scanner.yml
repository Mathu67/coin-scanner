name: Coin-Scanner

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde ein Dauerlauf (ca. 54 Min.), darin Kurs-Check alle 60 Sekunden
  workflow_dispatch:
    inputs:
      bilanz:
        description: "Nur Zwischenbilanz schicken (statt scannen)"
        type: boolean
        default: false
      dauer:
        description: "Minuten Laufzeit bei manuellem Start (Standard 5)"
        type: string
        default: "5"

permissions:
  contents: write   # state.json speichern
  issues: write     # Bilanz als Issue (GitHub schickt dir dann eine E-Mail)

concurrency:
  group: scanner
  cancel-in-progress: false   # nie zwei Läufe gleichzeitig, sonst gibt es Konflikte im Stand

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # neuesten Stand holen, nicht den vom Start-Zeitpunkt (sonst Konflikt nach Wartezeit)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Git einrichten
        run: |
          git config user.name "coin-scanner"
          git config user.email "actions@users.noreply.github.com"

      - name: Scanner laufen lassen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_DAUER_MIN: ${{ github.event_name == 'schedule' && '54' || inputs.dauer || '5' }}
          # optional, nur wenn du direkt per Gmail willst (siehe README):
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.bilanz }}" = "true" ]; then
            python scanner.py --bilanz
          else
            python scanner.py
          fi

      - name: Stand speichern
        if: always()
        run: |
          git add data
          git diff --cached --quiet || git commit -m "Scanner-Update $(date -u +%F_%H:%M)"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push fehlgeschlagen (Versuch $i), warte..."
            sleep $((i * 20))
          done
          exit 1
